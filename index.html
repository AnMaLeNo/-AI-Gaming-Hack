<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Game - Paris Survivor</title>
    
    <!-- Librairie MapLibre v5 (Support du Globe 3D) -->
    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Chargement direct des données POI pour éviter les blocages de sécurité du navigateur -->
    <script src="pois.js"></script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* Interface Utilisateur / HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 10, 10, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-weight: 500;}
        .color-box { width: 15px; height: 15px; margin-right: 10px; border-radius: 3px; box-shadow: 0 0 5px currentColor; }
    </style>
</head>
<body>

    <div id="hud">
        <h3 style="margin-top: 0; color: #fff; text-transform: uppercase; font-size: 1.1em; letter-spacing: 1px;">Points Stratégiques</h3>
        <div class="legend-item"><div class="color-box" style="background: #2ecc71; color: #2ecc71;"></div> Pharmacie</div>
        <div class="legend-item"><div class="color-box" style="background: #e74c3c; color: #e74c3c;"></div> Hôpital</div>
        <div class="legend-item"><div class="color-box" style="background: #3498db; color: #3498db;"></div> Commissariat</div>
        <div class="legend-item"><div class="color-box" style="background: #e67e22; color: #e67e22;"></div> Supermarché</div>
        <div class="legend-item"><div class="color-box" style="background: #444444; color: transparent; box-shadow: none;"></div> Bâtiment standard</div>
        <hr style="border-color: #444; margin: 15px 0;">
        <p style="font-size: 0.85em; margin-bottom: 5px; color: #aaa;">🖱️ <b>Molette :</b> Dézoomer pour voir la planète</p>
        <p style="font-size: 0.85em; margin-bottom: 0; color: #aaa;">🖱️ <b>Clic Droit + Glisser :</b> Tourner la caméra 3D</p>
    </div>

    <!-- Conteneur de la carte -->
    <div id="map"></div>

    <script>
        // Initialisation de la carte avec la projection Globe !
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
            center: [2.3488, 48.8534], // Paris
            zoom: 15.5,
            pitch: 65, // Inclinaison 3D forte
            bearing: -30,
            antialias: true
        });

        // Activer la projection globe après le chargement du style
        map.on('style.load', () => {
            map.setProjection({ type: 'globe' });
        });

        map.on('load', () => {
            // Ajouter un ciel étoilé / espace profond pour quand on regarde le globe
            map.setPaintProperty('background', 'background-color', '#050505');

            // 1. Ajouter le relief sur TOUS les bâtiments standards
            map.addLayer({
                'id': '3d-buildings',
                'source': 'carto',
                'source-layer': 'building',
                'type': 'fill-extrusion',
                'minzoom': 13,
                'paint': {
                    // Couleur plus cyberpunk, légèrement bleue nuit
                    'fill-extrusion-color': '#1a1c23', 
                    // Hauteur réduite pour faire plateau de jeu propre
                    'fill-extrusion-height': 4, 
                    'fill-extrusion-base': 0,
                    // Légère transparence pour un effet hologramme / jeu vidéo
                    'fill-extrusion-opacity': 0.85 
                }
            });

            map.addSource('pois', { type: 'geojson', data: poisData });

            // On sépare la couche POI en deux pour un effet "Néon" (un bloc interne brillant, un bloc externe transparent)
            
            // 1. Le "Cœur" du POI (Commence à la hauteur des toits gris)
            map.addLayer({
                'id': '3d-pois-core',
                'type': 'fill-extrusion',
                'source': 'pois',
                'paint': {
                    'fill-extrusion-color': ['get', 'color'],
                    // La base commence au sommet des bâtiments gris (4m)
                    'fill-extrusion-base': 4,
                    // La hauteur finale est la hauteur du POI + la base
                    'fill-extrusion-height': ['+', ['get', 'height'], 4],
                    'fill-extrusion-opacity': 1.0 
                }
            });

            // 2. Le "Halo" du POI
            map.addLayer({
                'id': '3d-pois-halo',
                'type': 'fill-extrusion',
                'source': 'pois',
                'paint': {
                    'fill-extrusion-color': ['get', 'color'],
                    'fill-extrusion-base': 4,
                    'fill-extrusion-height': [
                        '+', 
                        ['get', 'height'], 
                        19 // 15 de halo + 4 de base
                    ],
                    'fill-extrusion-opacity': 0.3
                }
            });
            
            console.log("Carte Globe 3D chargée avec succès !");
        });
    </script>
</body>
</html>
