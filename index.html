<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Game - Paris Survivor</title>
    
    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 10, 10, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h3 style="margin-top: 0; color: #fff; text-transform: uppercase; font-size: 1.1em; letter-spacing: 1px;">Contrôles</h3>
        <p style="font-size: 0.85em; margin-bottom: 5px; color: #aaa;">🖱️ <b>Molette :</b> Dézoomer</p>
        <p style="font-size: 0.85em; margin-bottom: 0; color: #aaa;">🖱️ <b>Clic Droit + Glisser :</b> Tourner la caméra</p>
    </div>

    <div id="map"></div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
            center: [2.3488, 48.8534], // Paris
            zoom: 15.5,
            pitch: 65,
            bearing: -30,
            antialias: true
        });

        map.on('style.load', () => {
            map.setProjection({ type: 'globe' });
        });

        map.on('load', () => {
            map.setPaintProperty('background', 'background-color', '#050505');

            map.addLayer({
                'id': '3d-buildings',
                'source': 'carto',
                'source-layer': 'building',
                'type': 'fill-extrusion',
                'minzoom': 13,
                'filter': [
                    'all',
                    ['!=', ['get', 'underground'], 'true'],
                    ['>=', ['get', 'render_height'], 5] 
                ],
                'paint': {
                    'fill-extrusion-color': '#1a1c23', 
                    'fill-extrusion-height': 500, // Bâtiments TITANESQUES
                    'fill-extrusion-base': 0,
                    'fill-extrusion-opacity': 1.0 
                }
            });
            
            console.log("Carte Globe 3D chargée avec succès !");
        });
    </script>
</body>
</html>
